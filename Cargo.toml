[package]
name = "keycast"
version = "0.1.1"
edition = "2021"
description = "Encrypted LAN keyboard broadcasting for Windows"
license = "MIT"
authors = ["Agasthya Reddy"]

[dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader"] }
ring = "0.17"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = "debuginfo"
lto = "thin"

